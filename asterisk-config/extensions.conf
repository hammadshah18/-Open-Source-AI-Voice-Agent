;==============================================================================
; Asterisk Dialplan for AI Voice Agent - Pure ARI System
; All calls are handled programmatically via ARI WebSocket
;==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

;==============================================================================
; Default Context - Routes all calls to ARI Stasis Application
;==============================================================================

[default]
; All incoming calls go directly to ARI
exten => _X.,1,NoOp(Incoming call - routing to AI Agent)
 same => n,Answer()
 same => n,Stasis(ai_voice_agent)
 same => n,Hangup()

;==============================================================================
; From-Trunk Context - External calls (PSTN/SIP trunks)
;==============================================================================

[from-trunk]
exten => _X.,1,NoOp(External call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(ai_voice_agent)
 same => n,Hangup()

;==============================================================================
; Stasis Context - Programmatic call control via ARI
;==============================================================================

[stasis-context]
exten => s,1,NoOp(ARI-controlled call)
 same => n,Answer()
 same => n,Stasis(ai_voice_agent)
 same => n,Hangup()
