;==============================================================================
; Asterisk HTTP Configuration (Required for ARI)
; File: /etc/asterisk/http.conf
;==============================================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; Enable HTTPS (optional but recommended for production)
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/asterisk.pem
;tlsprivatekey=/etc/asterisk/keys/asterisk.key

enablestatic=yes
redirect = / /httpstatus
